apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer-deployment
  labels:
    app: adminer-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adminer-project
  template:
    metadata:
      labels:
        app: adminer-project
    spec:
      containers:
        - name: adminer-deployment
          image: adminer:latest
          ports:
            - containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_SERVER
              # value: "postgres-blad"
              value: "postgres-service"
