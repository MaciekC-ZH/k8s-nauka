apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: shop-prod
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: APP_MESSAGE

          args:
            - "-text=$(APP_MESSAGE)"
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
