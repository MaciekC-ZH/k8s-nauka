apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-ingress
  namespace: blog-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: blog.localhost
      http:
        paths:
          - path: /db(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: adminer-service
                port:
                  number: 80
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: wordpress-service
                port:
                  number: 80
