apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-project
  template:
    metadata:
      labels:
        app: postgres-project
    spec:
      volumes:
        - name: staly-magazyn
          persistentVolumeClaim:
            claimName: postgres-pvc # Upewnij się, że tak nazywa się obiekt w pliku PVC
      containers:
        - name: app-kontener
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: staly-magazyn
              mountPath: /var/lib/postgresql/data
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
