apiVersion: v1
kind: Namespace
metadata:
  name: lab-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: lab-test
data:
  app.conf: |
    ENV=homelab
    DEBUG=true
    MESSAGE="Witaj w kontenerze k3s!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-playground
  namespace: lab-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-playground
  template:
    metadata:
      labels:
        app: web-playground
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-vol
              mountPath: /etc/moje-dane
      volumes:
        - name: config-vol
          configMap:
            name: app-config
---
apiVersion: v1
kind: Pod
metadata:
  name: toolbox-pod
  namespace: lab-test
spec:
  containers:
    - name: alpine
      image: alpine:latest
      command:
        [
          "sh",
          "-c",
          "mkdir -p /dane && echo 'Plik testowy do kopiowania' > /dane/notatka.txt && sleep infinity",
        ]
