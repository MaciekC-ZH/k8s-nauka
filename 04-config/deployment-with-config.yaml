apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-z-konfiguracja
  labels:
    app: demo-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-config
  template:
    metadata:
      labels:
        app: demo-config
    spec:
      containers:
        - name: app-kontener
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            # 1. Pobranie pojedynczej wartości z ConfigMap
            - name: SRODOWISKO
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            # 2. Pobranie hasła z Secretu
            - name: HASLO_DO_BAZY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
