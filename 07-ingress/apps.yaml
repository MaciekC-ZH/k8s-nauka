# --- APLIKACJA 1 (Powitalna strona A) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-alfa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfa
  template:
    metadata:
      labels:
        app: alfa
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo
          args:
            - "-text=Tu odpowiada Aplikacja ALFA!"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: alfa-service
spec:
  type: ClusterIP
  selector:
    app: alfa
  ports:
    - port: 80
      targetPort: 5678
---
# --- APLIKACJA 2 (Powitalna strona B) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beta
  template:
    metadata:
      labels:
        app: beta
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo
          args:
            - "-text=Tu odpowiada Aplikacja BETA!"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: beta-service
spec:
  type: ClusterIP
  selector:
    app: beta
  ports:
    - port: 80
      targetPort: 5678
