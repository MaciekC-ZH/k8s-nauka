apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
spec:
  containers:
    - name: stress-container
      image: polinux/stress
      resources:
        requests:
          memory: "32Mi"
          cpu: "100m"
        limits:
          memory: "50Mi"
          cpu: "200m"
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "100M", "--vm-hang", "1"]
