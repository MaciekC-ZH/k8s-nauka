apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-controlled-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: controlled-web
  template:
    metadata:
      labels:
        app: controlled-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
